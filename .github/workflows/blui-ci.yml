name: Build

on:
    push:
        branches: ['dev', 'master']
    pull_request:
        branches: ['dev', 'master']
    pull_request_target:
        types:
            - opened
        branches:
            - '*/*'

permissions:
    pull-requests: write
    contents: write

jobs:
    prettier_lint:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn install:dependencies
            - run: yarn prettier
            - run: yarn lint

    unit_test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn install:dependencies
            - run: yarn coverage
            - name: Upload to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  directory: ./coverage/
                  files: cobertura-coverage.xml
                  flags: unittests
                  name: codecov-report
                  verbose: true

    build_library:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn --immutable
            - run: yarn build:lib
            - name: Save build
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  if-no-files-found: error
                  path: dist

    test_artifacts:
        runs-on: ubuntu-latest
        needs: build_library
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download the dist folder
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - run: yarn test:artifacts

    npm_pack:
        runs-on: ubuntu-latest
        needs: build_library
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download the dist folder
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - run: npm pack
              working-directory: dist
            - name: Save npm pack
              uses: actions/upload-artifact@v4
              with:
                  name: tarball
                  if-no-files-found: error
                  path: dist

    build_showcase:
        runs-on: ubuntu-latest
        needs: npm_pack

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn initialize
            - run: yarn --immutable
              working-directory: showcase
            - name: Download tarball
              uses: actions/download-artifact@v4
              with:
                  name: tarball
                  path: tarball
            - run: |
                  PACKAGED_VERSION=`node -p "require('./tarball/package.json').version"`
                  yarn add ./tarball/brightlayer-ui-angular-components-$PACKAGED_VERSION.tgz
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn build
              working-directory: showcase

    build_ng_doc_site:
        runs-on: ubuntu-latest
        needs: npm_pack

        strategy:
            matrix:
                node-version: [20.x]
        env:
            base-href: ${{ github.ref == 'refs/heads/master' && '/angular/' || '/angular-dev/' }}
            build-type: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download tarball
              uses: actions/download-artifact@v4
              with:
                  name: tarball
                  path: tarball
            - run: |
                  PACKAGED_VERSION=`node -p "require('./tarball/package.json').version"`
                  yarn add ./tarball/brightlayer-ui-angular-components-$PACKAGED_VERSION.tgz
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - run: yarn --immutable
            - run: yarn build:demo --base-href ${{env.base-href}} -c ${{env.build-type}} && cp src/404.html build && touch ./build/.nojekyll
            - name: Save build
              uses: actions/upload-artifact@v4
              with:
                  name: build
                  if-no-files-found: error
                  path: build

    deploy_angular_doc_site_dev:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        needs: build_ng_doc_site
        env:
            DEV_DEPLOY_TOKEN: ${{secrets.DEV_DEPLOY_TOKEN}}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: build
            - name: deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: build
                  token: ${{env.DEV_DEPLOY_TOKEN}}
                  repository-name: brightlayer-ui-components/angular-dev
                  branch: master
                  git-config-name: Brightlayer UI Agent
                  git-config-email: brightlayer-ui@eaton.com
                  commit-message: 'Automated deployment to GitHub Pages ${{github.sha}}'

    deploy_angular_doc_site_prod:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        needs: build_ng_doc_site
        env:
            DEV_DEPLOY_TOKEN: ${{secrets.DEV_DEPLOY_TOKEN}}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download build
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: build
            - name: deploy
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: build
                  token: ${{env.DEV_DEPLOY_TOKEN}}
                  repository-name: brightlayer-ui-components/angular
                  branch: master
                  git-config-name: Brightlayer UI Agent
                  git-config-email: brightlayer-ui@eaton.com
                  commit-message: 'Automated deployment to GitHub Pages ${{github.sha}}'

    publish:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
        needs: build_library
        strategy:
            matrix:
                node-version: [20.x]
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            BRANCH: ${{ github.ref == 'refs/heads/master' && 'master' || 'dev' }}
        steps:
            - uses: actions/checkout@v4
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: 'https://registry.npmjs.org'
            - run: yarn --immutable
            - run: npm run publish:package -- -b ${{env.BRANCH}}
